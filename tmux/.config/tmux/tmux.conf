# NVim <Esc> for normal mode delay fix
set -sg escape-time 0

# Basic Settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard
set -g mode-keys vi

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Split windows (opens in same directory as current pane)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# join send pane
bind-key J command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key S command-prompt -p "send pane to:"  "join-pane -t '%%'"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -L
bind l select-pane -D

# Reload config
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift + arrows to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt + number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim style copying
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

## Style
# Status Bar
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 1

set -g status-style bg=default

# Message Bar
set -g message-style fg=black,bg=green

# Status Window
setw -g window-status-current-style fg=black,bg=green

# Panes
set -g pane-border-style fg=black,bg=default
set -g pane-active-border-style fg=green,bg=default

# Status Right
set -g status-right '#(whoami)@#(hostname) #[fg=green,bg=black] %d/%m #[fg=cyan,bg=black] %H:%M:%S '
